name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR that supersedes an in-flight run cancels it; main never cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: build · test · lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22'] # 20 is the floor declared in package.json engines

    steps:
      - uses: actions/checkout@v4

      # This project's testing philosophy is "real over mocked wherever real is
      # possible" (CLAUDE.md). Several suites therefore need real OS binaries,
      # not stubs, and silently skip or fail without them:
      #   bubblewrap      -> Tier 1 sandbox confinement tests (§12.5/§12.6)
      #   libsecret-tools -> OS keychain / Secret Service tests (§5.1 tier 1)
      #   gnome-keyring   -> the throwaway keyring those tests spin up
      #   dbus-x11        -> dbus-run-session, for that throwaway D-Bus session
      #   ripgrep         -> the `search` tool IS ripgrep (§9 Tier 0); without
      #                      it the tool correctly reports
      #                      `search-backend-unavailable` and its 3 tests fail.
      #                      Missing from this list originally, and one of the
      #                      two reasons every CI run was red.
      # Omitting these does not make the suite pass with less coverage — it
      # makes tests fail outright. They are load-bearing, not optional.
      - name: Install real sandbox + keychain + search backends
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap libsecret-tools gnome-keyring dbus-x11 ripgrep

      # `command -v` proves the binary is on PATH; it does NOT prove the
      # binary can do its job. bwrap in particular installs fine on a runner
      # and then cannot create namespaces, which is exactly the mistake
      # `detectBwrapUsable` was added to stop the *code* from making — so
      # this step reports the real capability rather than just presence.
      # A failure here is informational: the suite skips the confinement
      # tests on a host that can't run them (honestly), rather than failing.
      - name: Report which backends are actually usable, not just present
        run: |
          command -v bwrap
          command -v secret-tool
          command -v gnome-keyring-daemon
          command -v dbus-run-session
          command -v rg
          echo "--- can bwrap actually confine on this runner? ---"
          if bwrap --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
               --proc /proc --dev /dev --unshare-pid --unshare-ipc --unshare-uts \
               --unshare-net --unshare-cgroup --die-with-parent /bin/true; then
            echo "bwrap CAN confine — the Tier 1 sandbox tests will run for real."
          else
            echo "bwrap CANNOT confine here — the Tier 1 sandbox tests will skip (§12.5)."
            echo "That is expected on a hosted runner and is not a failure."
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The three gates, run separately so a failure names which one broke.
      # This mirrors exactly what CLAUDE.md requires before every commit.
      - name: Build (tsc -b, project references)
        run: pnpm build

      - name: Test (vitest, whole workspace)
        run: pnpm test

      - name: Lint (eslint)
        run: pnpm lint
